<title>Exterior 2026 — Apuração por País</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e5e5e5;overflow:hidden;height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#111;border-bottom:1px solid #222;z-index:1000}
  header h1{font-size:15px;font-weight:600;letter-spacing:.5px}
  header h1 span{color:#888}
  .stats{display:flex;gap:18px;font-size:13px}
  .stats b{font-weight:700}
  .lula{color:#e63946}.flavio{color:#3b82f6}
  #map{height:calc(100vh - 52px);width:100%}
  .panel{position:absolute;top:64px;right:12px;width:320px;max-height:calc(100vh - 88px);background:rgba(17,17,17,.95);border:1px solid #2a2a2a;border-radius:10px;overflow:hidden;z-index:1000;display:flex;flex-direction:column}
  .panel-head{padding:10px 14px;border-bottom:1px solid #222;font-size:12px;color:#888;display:flex;justify-content:space-between}
  .panel-list{overflow-y:auto;flex:1}
  .row{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid #1a1a1a;font-size:12.5px;cursor:pointer;transition:background .15s}
  .row:hover{background:#1c1c1c}
  .row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .row .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nums{font-variant-numeric:tabular-nums;color:#999}
  .row .pct{width:44px;text-align:right;font-weight:600}
  .badge{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
  .badge.l{background:#e6394622;color:#e63946}.badge.f{background:#3b82f622;color:#3b82f6}.badge.t{background:#8884;color:#aaa}
  .leaflet-container{background:#0d1117}
  .leaflet-control-zoom{border:none!important;box-shadow:none!important}
  .leaflet-control-zoom a{background:#1a1a1a!important;color:#ccc!important;border:1px solid #333!important}
  .tip{background:#1a1a1a;border:1px solid #333;color:#e5e5e5;font-size:12px;padding:6px 10px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
  .tip b{display:block;margin-bottom:2px}
  .refresh{font-size:11px;color:#555;padding:6px 14px;border-top:1px solid #222}
  .pulse{animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<header>
  <h1>EXTERIOR <span>2º TURNO 2026</span></h1>
  <div class="stats">

  </div>
</header>
<div id="map"></div>
